---
- name: Configure Minecraft server
  hosts: all
  become: true

  vars:
    aws_region: us-east-1

    ecr_registry: 619786279459.dkr.ecr.us-east-1.amazonaws.com/minecraft-server
    minecraft_image: latest

    container_name: minecraft

    data_mount: /data
    s3_backup_bucket: s3://minecraft-backups-reedyai/world

    memory: 4G
    jvm_opts: "-Xms2G -Xmx4G"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install prerequisites
      apt:
        name:
          - docker.io
          - awscli
        state: present

    - name: Ensure Docker is running
      systemd:
        name: docker
        enabled: true
        state: started

    # Sync with s3
    - name: Create Minecraft data directory
      file:
        path: "{{ data_mount }}"
        state: directory
        mode: "0755"

    - name: Restore world data from S3
      shell: |
        aws s3 sync {{ s3_backup_bucket }} {{ data_mount }}

    # Connect to ecr
    - name: Authenticate Docker to ECR (instance role)
      shell: |
        aws ecr get-login-password --region {{ aws_region }} \
        | docker login --username AWS --password-stdin {{ ecr_registry }}
      changed_when: false

    # Pull the latest image
    - name: Pull pinned Minecraft image
      community.docker.docker_image:
        name: "{{ ecr_registry }}:{{ minecraft_image }}"
        source: pull

    # If minecraft was already running on the machine stop it
    - name: Stop existing Minecraft container (if running)
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped
      ignore_errors: true

    - name: Remove old Minecraft container (clean restart safety)
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
      ignore_errors: true

    # Run minecraft in a container
    - name: Start Minecraft container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ ecr_registry }}:{{ minecraft_image }}"
        state: started
        restart_policy: unless-stopped

        published_ports:
          - "25565:25565"

        volumes:
          - "{{ data_mount }}:/data"

        env:
          EULA: "TRUE"
          MOTD: Reedyai
          MEMORY: "{{ memory }}"
          JVM_OPTS: "{{ jvm_opts }}"

    # Wait for it to start
    - name: Wait for Minecraft server startup
      shell: docker logs {{ container_name }} 2>&1 | grep -q "Done"
      register: minecraft_ready
      retries: 18
      delay: 10
      until: minecraft_ready.rc == 0
      changed_when: false

    # Create a script that will backuop the world to s3
    - name: Create Minecraft backup script
      copy:
        dest: /usr/local/bin/minecraft-backup.sh
        mode: "0755"
        content: |
          #!/bin/bash
          set -e

          echo "Stopping Minecraft container..."
          docker stop {{ container_name }} || true

          echo "Syncing world data to S3..."
          aws s3 sync {{ data_mount }} {{ s3_backup_bucket }}

          echo "Backup complete."

    # Have systemd run the script above when minecraft stops running
    - name: Create systemd service for shutdown backup
      copy:
        dest: /etc/systemd/system/minecraft-backup.service
        content: |
          [Unit]
          Description=Minecraft S3 Backup Service
          DefaultDependencies=no
          Before=shutdown.target reboot.target halt.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/minecraft-backup.sh

          [Install]
          WantedBy=halt.target reboot.target shutdown.target

    - name: Enable backup service
      systemd:
        name: minecraft-backup.service
        enabled: true
        daemon_reload: true